x}.post{padding:19px 20px;border-bottom:1px solid var(--line)}.post:last-child{border-bottom:0}.postbody{white-space:pre-wrap;line-height:1.55;margin:15px 0 18px}.actions{display:flex;gap:22px;color:var(--muted)}.actions button,.ghost{background:none;border:0;color:inherit;padding:0}.actions button:hover,.actions button.selected{color:var(--violet)}.compose{display:flex;gap:12px}.compose textarea{width:100%;min-height:74px;resize:vertical;background:transparent;border:0;outline:none;color:white}.composefooter{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.primary{background:linear-gradient(115deg,#8b5cf6,#7157b8);color:#fff;border:0;border-radius:12px;padding:10px 19px;font-weight:650}.primary:disabled{opacity:.4}.field{background:#171b30;border:1px solid var(--line);color:white;padding:12px;border-radius:12px;width:100%;outline:none}.field:focus{border-color:var(--violet)}.divider{border:0;border-top:1px solid var(--line);margin:16px 0}.student{display:flex;align-items:center;justify-content:space-between;padding:12px 0;gap:8px;border-bottom:1px solid var(--line)}.student:last-child{border-bottom:0}.student button{flex:none}.secondary{background:#28213c;border:1px solid #59477b;color:#d9caff;padding:7px 11px;border-radius:10px}.thread{display:flex;flex-direction:column;gap:12px;height:400px;overflow:auto;padding:12px 0}.bubble{padding:11px 14px;border-radius:17px;max-width:82%;line-height:1.5;background:#232841;align-self:flex-start}.bubble.mine{background:#49367b;align-self:flex-end}.bubble time{display:block;font-size:10px;opacity:.6;margin-top:5px}.messagebar{display:flex;gap:8px}.messagebar input{flex:1}.storyrail{display:flex;gap:15px;overflow:auto;padding:12px 0}.story{min-width:80px;text-align:center;cursor:pointer;font-size:12px}.story .avatar{border:2px solid #b18cfb;width:56px;height:56px;margin-bottom:6px}.alert{padding:12px;border-radius:12px;background:#2b2235;color:#e4d5f6;font-size:13px;margin:12px 0}.official{color:var(--gold)}.righttitle{font-weight:700;margin:5px 0 16px}.clock{font-size:20px;font-weight:700;margin:7px 0}.bottom{display:none}.hide{display:none!important}.preview{max-width:100%;border-radius:14px;margin-top:12px;max-height:400px}.modal{position:fixed;inset:0;background:#050510d9;display:grid;place-items:center;z-index:20;padding:20px}.modal .pane{width:min(420px,100%)}.empty{text-align:center;padding:45px 20px;color:var(--muted)}.channel{display:inline-block;padding:8px 12px;border:1px solid var(--line);border-radius:20px;margin:0 7px 8px 0;cursor:pointer}.channel.active{background:#403064;border-color:#8d6bc2}.login{width:min(430px,calc(100% - 32px));margin:12vh auto}.logohero{font-size:50px;letter-spacing:8px;font-weight:900;text-align:center}.logohero span{color:var(--violet)}@media(max-width:1080px){.layout{grid-template-columns:200px minmax(0,1fr)}.aside{display:none}}@media(max-width:700px){.layout{display:block;padding:12px 10px 88px}.sidebar{display:none}.pane{padding:16px;border-radius:16px}.post{padding:16px 5px}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;justify-content:space-around;background:#101325f2;border-top:1px solid var(--line);padding:9px 3px max(10px,env(safe-area-inset-bottom));z-index:10}.bottom button{background:none;border:0;color:#c1b9d6;font-size:21px}.bottom button.active{color:#b998ff}.bottom label{display:block;font-size:9px;margin-top:3px}.heading{font-size:22px}}

let S=null,tab='Home',selected=2,channel='general',draftMedia='',error='';const tabs=[['Home','⌂'],['Community','◈'],['Explore','⌕'],['Messages','✉'],['Stories','◎'],['Profile','♙'],['Campus','✦'],['Live','◉'],['Alerts','♧'],['Control','⚙']];const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const avatar=c=>`<div class="avatar ${c?.id===1?'me':''}">${esc((c?.name||'?').split(' ').map(x=>x[0]).slice(0,2).join(''))}</div>`;const person=c=>`<div class="person">${avatar(c)}<div><div class="name">${esc(c.name)} ${c.verified?'<span class="official">✦</span>':''}</div><div class="handle">@${esc(c.handle)} · ${esc(c.rank||'')}</div></div></div>`;const date=t=>new Date(t).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});const find=id=>S.characters.find(c=>c.id===id);async function api(path,method='GET',data){let r=await fetch('/api/'+path,{method,headers:data instanceof FormData?{}:{'Content-Type':'application/json'},body:data instanceof FormData?data:data?JSON.stringify(data):undefined});let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.detail||'Request failed');return j}async function load(){try{S=await api('state');render()}catch(e){S=null;error=e.message;render()}}function nav(t){tab=t;render();if(t==='Live')refreshLive();if(t==='Messages')refreshThread();window.scrollTo(0,0)}function render(){if(!S){$('app').innerHTML=`<div class="login pane"><div class="logohero">VY<span>B</span>E</div><p class="eyebrow" style="text-align:center">EIDOLON UNIVERSITY · PRIVATE ACCESS</p><p class="muted" style="text-align:center">Your campus. Your story.</p><form onsubmit="signIn(event)"><input class="field" id="password" type="password" placeholder="Private access password" required><button class="primary" style="width:100%;margin-top:12px">Enter VYBE</button></form><p class="small muted">${esc(error||'Private instance. Sign in to continue.')}</p></div>`;return}let content=({Home:home,Community:community,Explore:explore,Messages:messages,Stories:stories,Profile:profile,Campus:campus,Live:livePage,Alerts:alertsPage,Control:control})[tab]();$('app').innerHTML=`<div class="layout"><aside class="sidebar"><div class="brand">VY<span>B</span>E</div><div class="subbrand">EIDOLON UNIVERSITY</div>${tabs.map(([t,i])=>`<button class="nav ${tab===t?'active':''}" onclick="nav('${t}')"><span class="ico">${i}</span>${t}</button>`).join('')}<div class="pane" style="margin-top:28px">${person(find(1))}<p class="small muted">Your story, your choices.</p></div></aside><main><div class="feedtop"><div><div class="eyebrow">EIDOLON UNIVERSITY</div><div class="heading" style="margin:4px 0">${tab}</div></div><span class="pill">✦ ${esc(S.clock.slice(0,16).replace('T',' · '))}</span></div>${content}</main><aside class="aside"><div class="pane"><div class="eyebrow">CAMPUS CLOCK</div><div class="clock">${esc(S.clock.replace('T',' · ').slice(0,16))}</div><div class="small muted">Simulation ${S.paused?'paused':'running'} · ${S.speed}×</div><hr class="divider"><div class="righttitle">Around Eidolon</div><p class="muted small">Orientation week · September 2027</p><button class="secondary" onclick="nav('Campus')">Campus updates</button></div><div class="pane"><div class="righttitle">Discover students</div>${S.characters.slice(2,6).map(c=>`<div class="student">${person(c)}<button class="ghost" onclick="openChat(${c.id})">✉</button></div>`).join('')}</div></aside></div><nav class="bottom">${tabs.filter(([t])=>['Home','Community','Explore','Messages','Live','Profile'].includes(t)).map(([t,i])=>`<button class="${tab===t?'active':''}" onclick="nav('${t}')">${i}<label>${t}</label></button>`).join('')}<button onclick="nav('Alerts')">♧<label>Alerts</label></button><button onclick="nav('Control')">⚙<label>More</label></button></nav>`}
function compose(kind='post'){return `<div class="pane"><div class="compose">${avatar(find(1))}<div style="flex:1"><textarea id="compose" placeholder="What's happening at Eidolon?"></textarea><div id="mediaPreview"></div><div class="composefooter"><div><label class="secondary" style="cursor:pointer">＋ Photo<input type="file" accept="image/*" hidden onchange="upload(event)"></label></div><button class="primary" onclick="publish('${kind}')">${kind==='story'?'Add story':'Post'}</button></div></div></div></div>`}function postCard(p){let c=find(p.author);return `<article class="post">${person({...c,verified:p.verified})}<div class="small muted" style="margin:8px 0 0 55px">${esc(p.channel)} · ${esc(p.created.replace('T',' ').slice(0,16))}</div><div class="postbody">${esc(p.body)}</div>${p.media?`<img class="preview" src="${esc(p.media)}">`:''}<div class="actions"><button class="${p.liked?'selected':''}" onclick="react(${p.id},'like')">♥ ${p.likes}</button><button onclick="showComments(${p.id})">♧ ${p.comments}</button><button class="${p.saved?'selected':''}" onclick="react(${p.id},'save')">▣</button><button onclick="sharePost(${p.id})">↗</button></div><div id="comments-${p.id}"></div></article>`}function home(){return `<div class="pane"><div class="eyebrow">YOUR CAMPUS TODAY</div><div class="storyrail">${S.characters.slice(1,9).map(c=>`<div class="story" onclick="openChat(${c.id})">${avatar(c)}<div>${esc(c.name.split(' ')[0])}</div></div>`).join('')}</div></div>${compose()}<div class="pane" style="padding:0 16px">${S.posts.filter(p=>p.kind==='post').map(postCard).join('')}</div>`}function community(){return `<div class="pane"><div class="heading">Student conversations</div>${['general','academics','gossip','clubs','photography'].map(c=>`<span class="channel ${channel===c?'active':''}" onclick="channel='${c}';render()">#${c}</span>`).join('')}</div>${compose()}<div class="pane">${S.posts.filter(p=>p.channel===channel&&p.kind==='post').map(postCard).join('')||'<div class="empty">No posts here yet.</div>'}</div>`}function explore(){return `<div class="pane"><input id="search" class="field" placeholder="Search students, magic, majors…" oninput="searchStudents(this.value)"><div id="students">${students('')}</div></div>`}function students(q){return S.characters.filter(c=>c.id!==1&&JSON.stringify(c).toLowerCase().includes(q.toLowerCase())).map(c=>`<div class="student">${person(c)}<div><button class="secondary" onclick="toggleFollow(${c.id})">${S.following.includes(c.id)?'Following':'Follow'}</button> <button class="secondary" onclick="openChat(${c.id})">Message</button></div></div>`).join('')}function searchStudents(q){$('students').innerHTML=students(q)}function messages(){return `<div class="pane"><div class="eyebrow">DIRECT MESSAGES</div><select class="field" onchange="selected=Number(this.value);refreshThread()">${S.characters.filter(c=>c.id!==1).map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${esc(c.name)}</option>`).join('')}</select><div class="thread" id="thread"><div class="empty">Loading conversation…</div></div><div class="messagebar"><input class="field" id="msg" placeholder="Message ${esc(find(selected)?.name||'student')}…" onkeydown="if(event.key==='Enter')sendMessage()"><button class="primary" onclick="sendMessage()">Send</button></div><p class="small muted">Students have classes, sleep, moods and boundaries. Replies may take hours or never arrive. AI responses require a configured server key and active worker.</p></div>`}function openChat(id){selected=id;nav('Messages');refreshThread()}async function refreshThread(){if(tab!=='Messages')return;let id=selected;try{let msgs=await api('messages/'+id);if(selected!==id||!$('thread'))return;$('thread').innerHTML=msgs.length?msgs.map(m=>`<div class="bubble ${m.sender===1?'mine':''}">${esc(m.body)}<time>${esc(m.created.replace('T',' ').slice(0,16))}${m.sender===1?(m.read_at?' · Read':' · Sent'):''}</time></div>`).join(''):'<div class="empty">No messages yet. Conversations begin when you choose.</div>';$('thread').scrollTop=$('thread').scrollHeight}catch(e){alert(e.message)}}function stories(){return `${compose('story')}<div class="pane"><div class="heading">Campus stories</div>${S.posts.filter(p=>p.kind==='story').map(postCard).join('')||'<div class="empty">No active stories. Stories expire after 24 in-world hours.</div>'}</div>`}function profile(){let mine=S.posts.filter(p=>p.author===1);return `<div class="pane">${person(find(1))}<p class="muted">Aster Hall · Room 314 · Arcane Theory · Freshman</p><div class="pill">F-rank · provisional</div><p class="small muted">@celestiaveyne · EU-12749</p><p>${S.following.length} following · ${mine.length} posts · ${(S.relationships||[]).reduce((a,r)=>a+r.familiarity,0)} social connections</p></div><div class="pane">${mine.map(postCard).join('')||'<div class="empty">Your posts will appear here.</div>'}</div>`}function campus(){return `<div class="pane"><div class="eyebrow">OFFICIAL BULLETIN</div><div class="heading">University announcements</div><div class="alert">✦ Verified notices are marked with a gold star. Student posts and rumors are not official.</div>${S.posts.filter(p=>p.verified).map(postCard).join('')}</div><div class="pane"><div class="heading">Academic calendar</div><p>September 6, 2027 · Academic year begins</p><p class="muted">Further events must be established through canon sync or authorized simulation.</p></div>`}function livePage(){return `<div class="pane"><div class="eyebrow"><span class="live-dot"></span>VYBE LIVE · SIMULATED CAMPUS</div><div class="heading">Around Eidolon right now</div><p class="small muted">Student locations and availability follow the fictional clock. This view never creates canon events.</p><div id="liveStudents"><div class="empty">Checking the campus…</div></div></div><div class="pane"><div class="heading">Social pulse</div>${(S.activity||[]).slice(0,15).map(a=>`<div class="activity-card small"><span class="official">✦</span> ${esc(find(a.actor)?.name||'Student')} ${esc(a.action)} ${a.target?'#'+a.target:''}<div class="muted">${esc(a.created.slice(0,16).replace('T',' · '))}</div></div>`).join('')||'<p class="muted">Campus is quiet for now.</p>'}</div>`}
async function refreshLive(){if(tab!=='Live')return;try{let j=await api('campus-live');let el=$('liveStudents');if(el)el.innerHTML=j.students.map(c=>`<div class="student"><div><div class="name">${esc(c.name)} <span class="small muted">${esc(c.rank)}</span></div><div class="small muted">${esc(c.activity)} · ${esc(c.location)}</div></div><button class="secondary" onclick="openChat(${c.id})">${c.available?'Message':'Leave message'}</button></div>`).join('')}catch(e){let el=$('liveStudents');if(el)el.textContent=e.message}}
function alertsPage(){return `<div class="pane"><div class="feedtop"><div class="heading">Notifications</div><button class="secondary" onclick="markAlerts()">Mark all read</button></div>${S.notifications.map(n=>`<div class="activity-card"><span class="${n.seen?'muted':'official'}">${n.seen?'○':'●'}</span> ${esc(n.body)}<div class="small muted">${esc(n.created.slice(0,16).replace('T',' · '))}</div></div>`).join('')||'<div class="empty">No notifications yet.</div>'}</div>`}
async function markAlerts(){await api('notifications/read','POST');await load()}
function control(){return `<div class="pane"><div class="heading">World clock</div><p class="muted">Current fictional time: ${esc(S.clock)}</p><button class="secondary" onclick="setClock({paused:${!S.paused}})">${S.paused?'Resume':'Pause'}</button> <button class="secondary" onclick="setClock({advance_minutes:60})">Advance 1 hour</button><p class="small muted">Speed</p><select class="field" onchange="setClock({speed:Number(this.value)})">${[1].map(v=>`<option ${S.speed===v?'selected':''} value="${v}">${v}×</option>`).join('')}</select></div><div class="pane"><div class="heading">Story Bridge · Event Inbox</div><p class="small muted">Record every roleplay beat as structured events. Imported events are staged, not canonized. Private and author-only events never become student knowledge automatically.</p><textarea class="field" id="bridgeJSON" rows="7" placeholder='Paste JSON: {"events":[{"summary":"Celestia enters the library","event_type":"movement","participants":["Celestia"],"visibility":"author","fictional_time":"2027-09-06T08:15:00"}]}'></textarea><button class="primary" onclick="importBridge()">Import roleplay events</button> <button class="secondary" onclick="download('bridge/events?limit=500','vybe-story-bridge-events.json')">Export event inbox</button><p id="bridgeResult" class="small muted"></p><hr class="divider"><div class="heading">Story Sync</div><p class="small muted">Paste canon developments. Entries are staged for review by default, not automatically applied to character knowledge.</p><textarea class="field" id="syncText" rows="5" placeholder="Paste an event from the roleplay…"></textarea><select class="field" id="visibility" style="margin:10px 0"><option value="public">Public information</option><option value="private">Private knowledge</option><option value="author">Author only</option></select><button class="primary" onclick="stageSync()">Stage event</button><p class="small muted">Staging and approval preserve the event log. Automatic conflict reconciliation is not yet implemented.</p><hr class="divider">${S.log.map(l=>`<div class="student"><div><div class="small">${esc(l.summary.slice(0,160))}</div><div class="small muted">${esc(l.visibility)} · ${l.imported?'approved':'staged'}</div></div>${l.imported?'':`<button class="secondary" onclick="approve(${l.id})">Approve</button>`}<button class="ghost" onclick="removeSync(${l.id})">✕</button></div>`).join('')}</div><div class="pane"><div class="heading">Backups & continuity</div><button class="secondary" onclick="download('export','vybe-backup.json')">Export database</button> <button class="secondary" onclick="download('story-export','vybe-story-sync.json')">Export roleplay update</button><hr class="divider"><div class="heading">Scheduled events</div>${S.events.slice(0,15).map(e=>`<div class="small muted" style="padding:8px 0">${esc(e.kind)} · ${esc(e.due)} · ${esc(e.status)}</div>`).join('')||'<p class="muted">No pending events.</p>'}<hr class="divider"><button class="secondary" onclick="logout()">Sign out</button></div>`}
async function importBridge(){let out=$('bridgeResult');try{let parsed=JSON.parse($('bridgeJSON').value);if(Array.isArray(parsed))parsed={events:parsed};if(!Array.isArray(parsed.events))throw Error('Provide an events array');let result=await api('bridge/events','POST',parsed);out.textContent=`Staged ${result.results.filter(x=>!x.duplicate).length} events. ${result.results.filter(x=>x.duplicate).length} duplicates skipped. No canon changes.`;$('bridgeJSON').value=''}catch(e){out.textContent='Import failed: '+e.message}}
async function signIn(e){e.preventDefault();try{await api('login','POST',{password:$('password').value});await load()}catch(e){error=e.message;render()}}async function logout(){await api('logout','POST');S=null;render()}async function publish(kind){let body=$('compose').value;try{await api('posts','POST',{body,kind,channel:tab==='Community'?channel:'general',media:draftMedia});draftMedia='';await load()}catch(e){alert(e.message)}}async function react(post,kind){try{await api('react','POST',{post,kind});await load()}catch(e){alert(e.message)}}async function showComments(id){let box=$('comments-'+id);if(box.innerHTML){box.innerHTML='';return}await renderComments(id)}
async function renderComments(id){let box=$('comments-'+id);if(!box)return;let c=await api('comments/'+id);let byParent={};c.forEach(x=>(byParent[x.parent||0]??=[]).push(x));function branch(parent,depth=0){if(depth>5)return '';return (byParent[parent]||[]).map(x=>`<div class="comment-entry" style="margin-left:${Math.min(depth,4)*16}px"><b>${esc(x.name)}</b> <span class="small muted">@${esc(x.handle)}</span><div>${esc(x.body)}</div><button class="reply-link" onclick="replyTo(${id},${x.id},'${esc(x.handle)}')">↳ Reply</button>${branch(x.id,depth+1)}</div>`).join('')}box.innerHTML=`<hr class="divider">${branch(0)}<div id="replyHint-${id}" class="small muted"></div><div class="messagebar"><input class="field" id="comment-${id}" placeholder="Write a comment"><button class="secondary" onclick="addComment(${id})">Post</button></div>`}
let replyParents={};function replyTo(post,parent,handle){replyParents[post]=parent;$('replyHint-'+post).textContent='Replying to @'+handle+' · tap here to cancel';$('replyHint-'+post).onclick=()=>{delete replyParents[post];$('replyHint-'+post).textContent=''};$('comment-'+post).focus()}
async function addComment(post){let input=$('comment-'+post);let body=input.value;if(!body.trim())return;await api('comments','POST',{post,body,parent:replyParents[post]||null});delete replyParents[post];await renderComments(post)}
async function toggleFollow(id){await api('follow/'+id,'POST');await load()}async function sendMessage(){let body=$('msg').value;if(!body.trim())return;await api('messages','POST',{recipient:selected,body});$('msg').value='';await refreshThread()}async function upload(e){let f=e.target.files[0];if(!f)return;let fd=new FormData();fd.append('file',f);try{let j=await api('upload','POST',fd);draftMedia=j.url;$('mediaPreview').innerHTML=`<img class="preview" src="${esc(draftMedia)}">`}catch(e){alert(e.message)}}async function setClock(x){await api('clock','POST',x);await load()}async function stageSync(){await api('sync','POST',{summary:$('syncText').value,visibility:$('visibility').value});await load()}async function approve(id){await api('sync/approve/'+id,'POST');await load()}async function removeSync(id){if(confirm('Remove this staged or approved log entry?')){await api('sync/'+id,'DELETE');await load()}}async function download(endpoint,name){let j=await api(endpoint);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(j,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function sharePost(id){navigator.clipboard?.writeText('VYBE post #'+id).then(()=>alert('Post reference copied')).catch(()=>alert('Post #'+id))}load();setInterval(()=>{if(S&&tab==='Messages')refreshThread()},30000);setInterval(()=>{if(S&&tab!=='Messages'&&document.visibilityState==='visible')load()},60000);
